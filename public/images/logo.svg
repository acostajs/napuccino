<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradual glow effects -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <!-- Warm amber gradient for the moon -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Frothy/latte cream gradient for the cup -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="60" cy="65" r="45" fill="url(#glow)" />

  <!-- Steaming Waves (calming, smooth motion paths) -->
  <path d="M 45 35 Q 48 23 43 15" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.65" />
  <path d="M 57 33 Q 61 20 55 12" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 69 35 Q 72 25 67 17" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.65" />

  <!-- Sleek Modern Coffee Cup -->
  <!-- Cup Handle -->
  <path d="M 76 56 C 88 56 88 74 76 74" fill="none" stroke="url(#cupGrad)" stroke-width="6.5" stroke-linecap="round" />
  
  <!-- Cup Body -->
  <path d="M 38 48 H 76 C 76 48 76 80 57 80 C 38 80 38 48 38 48 Z" fill="url(#cupGrad)" />
  
  <!-- Rim / Froth Line -->
  <ellipse cx="57" cy="48" rx="19" ry="3.5" fill="#4a2c11" />
  <ellipse cx="57" cy="48" rx="16" ry="2.5" fill="#f5ebe0" opacity="0.9" />

  <!-- Calming Sleep Crescent Moon -->
  <path d="M 75 75 C 91.56 75 105 61.56 105 45 C 105 38.6 102.95 32.7 99.5 27.9 C 101.9 32.9 103.2 38.5 103.2 44.5 C 103.2 59.7 90.9 72 75.7 72 C 72 72 68.45 71.2 65.3 69.8 C 69.5 73 74.8 75 80.5 75 Z" fill="url(#moonGrad)" transform="translate(-10, -5)" />

  <!-- Modern Sleek Saucer/Plate Base -->
  <path d="M 30 86 H 84 C 92 86 92 90 84 90 H 30 C 22 90 22 86 30 86 Z" fill="#78716c" opacity="0.8" />
</svg>
